name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[pixel]'

      - name: Tier 1 only (no pixel extras needed)
        run: python -m unittest tests.test_c2pa -v

      - name: Full suite (tier 1 + tier 2)
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          python -c "from tests.fixture_builders import write_fixtures; write_fixtures('smoke')"
          image-provenance smoke/signed_synthetic.png | head -5
          image-provenance smoke/plain.png --mode c2pa || echo "exit 1 as expected for NO_C2PA"
