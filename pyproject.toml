[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "image-provenance-mcp"
version = "0.1.0"
description = "C2PA-first image provenance MCP server: read the signature, then guess from pixels"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DanZai233" }]
keywords = ["mcp", "c2pa", "content-credentials", "forensics", "ai-detection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
# Tier 2 (pixel heuristics). Without this extra the server still answers tier 1.
pixel = ["numpy>=1.24", "scipy>=1.11", "pillow>=10.0"]
dev = ["pytest>=8"]

[project.scripts]
image-provenance = "provenance_mcp.cli:main"
image-provenance-mcp = "provenance_mcp.server:main"

[project.urls]
Homepage = "https://github.com/DanZai233/image-provenance-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE.md", "LICENSES-image-forensics-mcp.txt"]
